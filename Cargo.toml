[package]
name = "pretty-ens"
version = "0.2.0"
edition = "2021"
description = "Check availability of .eth and .box domains from a wordlist"
license = "MIT"
authors = ["kualta <contact@kualta.dev>"]
repository = "https://github.com/kualta/pens"
keywords = ["ens", "ethereum", "domains", "web3"]
categories = ["command-line-utilities"]

[dependencies]
tokio = { version = "1", features = ["full", "signal"] }
alloy = { version = "1", features = ["provider-http", "sol-types", "contract"] }
reqwest = { version = "0.12", features = ["json"] }
governor = "0.10"
backon = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
indicatif = "0.17"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
sha2 = "0.10"
csv = "1.3"
rand = "0.8"
